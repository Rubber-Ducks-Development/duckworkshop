name: Bug report
description: Report a reproducible problem in the application.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security-sensitive findings, use the repository's SECURITY.md instead of a public issue.
        Share only sample files and screenshots you have permission to publish.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: Version shown in Help > About
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and affected tool
      placeholder: Windows version, tool or menu, and relevant file type
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening the app or a minimal sample project.
      placeholder: "List each action in order."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact error text if one appears.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal sample or screenshot
      description: Do not attach private projects, game archives, credentials or signing keys. Use synthetic or shareable examples.
