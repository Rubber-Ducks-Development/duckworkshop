[package]
name = "duck-workshop"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Duck Workshop - native vehicle development tools"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
roxmltree = "0.20"
xmltree = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "dds", "tiff", "gif"] }
psd = "0.3"
tiny-skia = "0.11"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
glam = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"
ureq = "3"
url = "2"
tempfile = "3"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "duck-workshop"
path = "src/main.rs"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"
